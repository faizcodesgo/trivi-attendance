<!DOCTYPE html>
<html>
<head>
  <title>Dashboard - TriVi Infracons</title>
  <link rel="stylesheet" href="style.css">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      display: flex;
    }

    /* SIDEBAR */
    .sidebar {
      width: 240px;
      background: #0b1f3a;
      color: white;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 20px;
      position: fixed;
    }

    .sidebar h2 {
      margin-bottom: 30px;
    }

    .nav {
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex: 1;
    }

    .nav a {
      color: white;
      text-decoration: none;
      padding: 10px;
      border-radius: 8px;
      transition: 0.2s;
      font-size: 14px;
    }

    .nav a:hover {
      background: rgba(255,255,255,0.1);
    }

    .logout {
      background: #702020;
      text-align: center;
      padding: 10px;
      border-radius: 10px;
      cursor: pointer;
      margin-top: auto;
    }

    /* MAIN */
    .main {
      margin-left: 240px;
      padding: 20px;
      width: 100%;
    }

    /* TOP BAR */
    .topbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 20px;
      align-items: center;
    }

    .topbar input,
    .topbar button {
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ddd;
    }

    .topbar button {
      background: #111827;
      color: white;
      cursor: pointer;
      border: none;
    }

    /* STATS */
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }

    .card {
      background: white;
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.05);
      text-align: center;
      font-weight: bold;
    }

    /* TABLE */
    .table-card {
      background: white;
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.05);
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 12px;
      text-align: center;
      border-bottom: 1px solid #eee;
      font-size: 14px;
    }

    th {
      background: #111827;
      color: white;
    }

    tr:hover {
      background: #f9fafb;
    }

    .edit {
      background: #2563eb;
      color: white;
      border: none;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
    }

    .danger {
      background: #dc2626;
      color: white;
      border: none;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
    }

    .image-preview {
      width: 40px;
      height: 40px;
      object-fit: cover;
      border-radius: 6px;
      cursor: pointer;
    }

    /* MODAL */
    .modal {
      display: none;
      position: fixed;
      top:0;
      left:0;
      width:100%;
      height:100%;
      background: rgba(0,0,0,0.5);
      justify-content:center;
      align-items:center;
    }

    .modal-content {
      background: white;
      padding: 20px;
      border-radius: 12px;
      width: 300px;
    }
  </style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <h2>TriVi</h2>

  <div class="nav">
    <a href="/dashboard">📊 Dashboard</a>
    <a href="/">📅 Attendance</a>
    <a href="#" onclick="exportExcel()">📤 Export</a>
  </div>

  <div class="logout" onclick="window.location.href='/auth/logout'">
    Logout
  </div>
</div>

<!-- MAIN -->
<div class="main">

  <!-- TOP BAR -->
  <div class="topbar">
    <input type="text" id="searchInput" placeholder="Search">
    <input type="date" id="singleDate">
    <input type="date" id="fromDate">
    <input type="date" id="toDate">

    <button onclick="applyFilters()">Apply</button>
    <button onclick="resetFilters()">Reset</button>
  </div>

  <!-- STATS -->
  <div class="stats">
    <div class="card">Total <div id="total">0</div></div>
    <div class="card">WFH <div id="wfh">0</div></div>
    <div class="card">Office <div id="office">0</div></div>
    <div class="card">Site <div id="site">0</div></div>
    <div class="card">Leave <div id="leave">0</div></div>
    <div class="card">Govt <div id="govt">0</div></div>
  </div>

  <!-- TABLE -->
  <div class="table-card">
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Date</th>
          <th>Time</th>
          <th>Work Type</th>
          <th>Image</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

</div>

<!-- IMAGE MODAL -->
<div class="modal" id="imageModal">
  <div class="modal-content">
    <img id="previewImage" style="width:100%; border-radius:10px;">
  </div>
</div>

<script>

let allData = [];
let editId = null;

// LOAD DATA
async function loadData() {

  try {

    const res = await fetch("/attendance", {
      credentials: "include"
    });

    const data = await res.json();

    allData = Array.isArray(data) ? data : [];

    render(allData);

  } catch (err) {
    console.log(err);
    alert("Failed to load attendance");
  }
}

// RENDER TABLE + STATS
function render(data) {

  const tbody = document.getElementById("tbody");

  tbody.innerHTML = "";

  let stats = {
    total: data.length,
    wfh: 0,
    office: 0,
    site: 0,
    leave: 0,
    govt: 0
  };

  data.forEach(item => {

    // STATS
    (item.workTypes || []).forEach(t => {

      if (t.includes("Work From Home")) stats.wfh++;

      else if (t.includes("Office")) stats.office++;

      else if (t.includes("Site")) stats.site++;

      else if (t.includes("Leave")) stats.leave++;

      else if (t.includes("Government")) stats.govt++;
    });

    // TABLE ROW
    const row = document.createElement("tr");

    row.innerHTML = `
      <td>${item.name || ""}</td>

      <td>${item.date || ""}</td>

      <td>${item.day || ""}</td>

      <td>${item.time || ""}</td>

      <td>${(item.workTypes || []).join(", ")}</td>

      <td>
        ${
          item.imageUrl
          ? `
            <img
              src="${item.imageUrl}"
              class="image-preview"
              onclick="openImage('${item.imageUrl}')"
            >
          `
          : "No Image"
        }
      </td>

      <td>
        <button
          class="edit"
          onclick="openEdit('${item._id}')"
        >
          Edit
        </button>

        <button
          class="danger"
          onclick="deleteEntry('${item._id}')"
        >
          Delete
        </button>
      </td>
    `;

    tbody.appendChild(row);
  });

  // UPDATE STATS
  document.getElementById("total").innerText = stats.total;

  document.getElementById("wfh").innerText = stats.wfh;

  document.getElementById("office").innerText = stats.office;

  document.getElementById("site").innerText = stats.site;

  document.getElementById("leave").innerText = stats.leave;

  document.getElementById("govt").innerText = stats.govt;
}

// APPLY FILTERS
function applyFilters() {

  const search =
    document.getElementById("searchInput")
    .value
    .toLowerCase();

  const singleDate =
    document.getElementById("singleDate").value;

  const fromDate =
    document.getElementById("fromDate").value;

  const toDate =
    document.getElementById("toDate").value;

  let filtered = [...allData];

  // SEARCH
  if (search) {

    filtered = filtered.filter(item =>

      (item.name || "")
      .toLowerCase()
      .includes(search)

      ||

      (item.email || "")
      .toLowerCase()
      .includes(search)
    );
  }

  // DATE FILTER
  if (fromDate && toDate) {

    // RANGE
    filtered = filtered.filter(item =>

      item.date >= fromDate
      &&
      item.date <= toDate
    );

  }

  else if (singleDate) {

    // PINPOINT
    filtered = filtered.filter(item =>

      item.date === singleDate
    );
  }

  render(filtered);
}

// RESET FILTERS
function resetFilters() {

  document.getElementById("searchInput").value = "";

  document.getElementById("singleDate").value = "";

  document.getElementById("fromDate").value = "";

  document.getElementById("toDate").value = "";

  render(allData);
}

// EXPORT EXCEL
async function exportExcel() {

  const search =
    document.getElementById("searchInput").value;

  const singleDate =
    document.getElementById("singleDate").value;

  const fromDate =
    document.getElementById("fromDate").value;

  const toDate =
    document.getElementById("toDate").value;

  const params = new URLSearchParams({
    search,
    singleDate,
    fromDate,
    toDate
  });

  try {

    const response = await fetch(

      "/attendance/export/excel?" + params.toString(),

      {
        credentials: "include"
      }
    );

    if (!response.ok) {

      alert("Export failed");

      return;
    }

    const blob = await response.blob();

    const url =
      window.URL.createObjectURL(blob);

    const a = document.createElement("a");

    a.href = url;

    a.download =
      `attendance-${Date.now()}.xlsx`;

    document.body.appendChild(a);

    a.click();

    a.remove();

    window.URL.revokeObjectURL(url);

  } catch (err) {

    console.log(err);

    alert("Export error");
  }
}

// DELETE
async function deleteEntry(id) {

  const confirmDelete =
    confirm("Delete this attendance?");

  if (!confirmDelete) return;

  try {

    await fetch("/attendance/" + id, {

      method: "DELETE",

      credentials: "include"
    });

    loadData();

  } catch (err) {

    console.log(err);

    alert("Delete failed");
  }
}

// OPEN EDIT MODAL
function openEdit(id) {

  editId = id;

  const item =
    allData.find(x => x._id === id);

  const current =
    item?.workTypes || [];

  document
    .querySelectorAll(".checkbox-group input")
    .forEach(cb => {

      cb.checked =
        current.includes(cb.value);
    });

  document
    .getElementById("editModal")
    .style.display = "flex";
}

// SAVE EDIT
async function saveEdit() {

  const selected = Array.from(

    document.querySelectorAll(
      ".checkbox-group input:checked"
    )

  ).map(cb => cb.value);

  if (selected.length === 0) {

    alert("Select at least one option");

    return;
  }

  if (selected.length > 2) {

    alert("Only 2 selections allowed");

    return;
  }

  try {

    await fetch("/attendance/" + editId, {

      method: "PUT",

      headers: {
        "Content-Type": "application/json"
      },

      credentials: "include",

      body: JSON.stringify({
        workTypes: selected
      })
    });

    document
      .getElementById("editModal")
      .style.display = "none";

    loadData();

  } catch (err) {

    console.log(err);

    alert("Update failed");
  }
}

// RESET MODAL
function resetModal() {

  document
    .querySelectorAll(".checkbox-group input")
    .forEach(cb => cb.checked = false);
}

// IMAGE MODAL
function openImage(url) {

  document
    .getElementById("previewImage")
    .src = url;

  document
    .getElementById("imageModal")
    .style.display = "flex";
}

// CLOSE MODALS
document
.getElementById("imageModal")
.addEventListener("click", (e) => {

  if (e.target.id === "imageModal") {

    document
      .getElementById("imageModal")
      .style.display = "none";
  }
});

document
.getElementById("editModal")
.addEventListener("click", (e) => {

  if (e.target.id === "editModal") {

    document
      .getElementById("editModal")
      .style.display = "none";
  }
});

// GLOBAL BUTTON BINDING
window.applyFilters = applyFilters;

window.resetFilters = resetFilters;

window.exportExcel = exportExcel;

window.deleteEntry = deleteEntry;

window.openEdit = openEdit;

window.saveEdit = saveEdit;

window.resetModal = resetModal;

// INITIAL LOAD
loadData();

</script>

</body>
</html>
