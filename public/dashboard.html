<!DOCTYPE html>
<html>
<head>
  <title>Dashboard - TriVi Infracons</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#7f1d1d">

<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

  
body{
  margin:0;
  font-family:'Poppins',sans-serif;

  background:
    linear-gradient(
      135deg,
      #140509,
      #2b0d12,
      #5a0f18
    );

  min-height:100vh;

  display:flex;

  color:white;

  overflow-x:hidden;
}

/* =========================
   SIDEBAR
========================= */

.sidebar{
  width:270px;

  height:100vh;

  position:sticky;
  top:0;

  padding:24px;

  display:flex;
  flex-direction:column;

  background:
    rgba(255,255,255,0.08);

  backdrop-filter:blur(20px);

  border-right:
    1px solid rgba(255,255,255,0.12);

  box-shadow:
    0 8px 30px rgba(0,0,0,0.2);

  z-index:10;
}

.sidebar h2{
  font-size:30px;
  margin-bottom:24px;
  font-weight:700;
}

.nav{
  display:flex;
  flex-direction:column;
  gap:14px;
  margin-top:20px;
}

.nav a{
  text-decoration:none;

  color:white;

  padding:14px 16px;

  border-radius:16px;

  background:
    rgba(255,255,255,0.05);

  transition:0.3s ease;

  font-weight:500;
}

.nav a:hover{
  transform:translateX(5px);

  background:
    rgba(255,255,255,0.14);

  box-shadow:
    0 8px 20px rgba(0,0,0,0.18);
}

.logout{
  margin-top:auto;

  padding:14px;

  border-radius:16px;

  text-align:center;

  background:
    linear-gradient(
      135deg,
      #dc2626,
      #991b1b
    );

  cursor:pointer;

  transition:0.3s ease;
}

.logout:hover{
  transform:translateY(-2px);
}

/* =========================
   MAIN
========================= */

.main{
  flex:1;
  padding:28px;
}

/* =========================
   FILTERS
========================= */

.controls{
  display:flex;
  flex-wrap:wrap;
  gap:14px;

  padding:22px;

  border-radius:24px;

  background:
    rgba(255,255,255,0.08);

  backdrop-filter:blur(18px);

  border:
    1px solid rgba(255,255,255,0.1);

  margin-bottom:24px;

  box-shadow:
    0 8px 30px rgba(0,0,0,0.15);
}

.control-group{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.control-group label{
  font-size:13px;
  color:#f3f4f6;
}

.control-group input{
  padding:12px 14px;

  border:none;

  border-radius:14px;

  background:
    rgba(255,255,255,0.12);

  color:white;

  outline:none;
}

.controls button{
  padding:12px 18px;

  border:none;

  border-radius:14px;

  cursor:pointer;

  font-weight:600;

  color:white;

  background:
    linear-gradient(
      135deg,
      #111827,
      #374151
    );

  transition:0.3s ease;
}

.controls button:hover{
  transform:translateY(-2px);

  box-shadow:
    0 10px 24px rgba(0,0,0,0.2);
}

/* =========================
   STATS
========================= */

.stats{
  display:grid;

  grid-template-columns:
    repeat(auto-fit,minmax(180px,1fr));

  gap:18px;

  margin-bottom:26px;
}

.card{
  padding:24px;

  border-radius:24px;

  background:
    rgba(255,255,255,0.08);

  backdrop-filter:blur(18px);

  border:
    1px solid rgba(255,255,255,0.1);

  text-align:center;

  transition:0.35s ease;

  animation:fadeUp 0.7s ease;
}

.card:hover{
  transform:
    translateY(-6px)
    scale(1.02);

  box-shadow:
    0 14px 34px rgba(0,0,0,0.24);
}

.card div{
  font-size:34px;
  font-weight:700;
  margin-top:12px;
}

/* =========================
   TABLE
========================= */

.table-card{
  background:
    rgba(255,255,255,0.08);

  backdrop-filter:blur(18px);

  border:
    1px solid rgba(255,255,255,0.1);

  border-radius:24px;

  padding:20px;

  overflow:auto;

  box-shadow:
    0 10px 28px rgba(0,0,0,0.18);
}

table{
  width:100%;
  border-collapse:collapse;
}

th{
  background:
    rgba(255,255,255,0.12);

  padding:16px;

  font-size:14px;

  color:white;
}

td{
  padding:16px;

  border-bottom:
    1px solid rgba(255,255,255,0.08);

  text-align:center;

  color:#f3f4f6;
}

tr{
  transition:0.25s ease;
}

tr:hover{
  background:
    rgba(255,255,255,0.05);
}

/* =========================
   BUTTONS
========================= */

.edit,
.danger{
  border:none;

  padding:10px 14px;

  border-radius:12px;

  cursor:pointer;

  color:white;

  font-weight:600;

  transition:0.3s ease;
}

.edit{
  background:
    linear-gradient(
      135deg,
      #2563eb,
      #1d4ed8
    );
}

.danger{
  background:
    linear-gradient(
      135deg,
      #dc2626,
      #991b1b
    );
}

.edit:hover,
.danger:hover{
  transform:translateY(-2px);
}

/* =========================
   IMAGE PREVIEW
========================= */

.image-preview{
  width:52px;
  height:52px;

  object-fit:cover;

  border-radius:14px;

  cursor:pointer;

  transition:0.3s ease;
}

.image-preview:hover{
  transform:scale(1.08);

  box-shadow:
    0 10px 24px rgba(0,0,0,0.3);
}

/* =========================
   MODAL
========================= */

.modal{
  display:none;

  position:fixed;

  top:0;
  left:0;

  width:100%;
  height:100%;

  justify-content:center;
  align-items:center;

  background:
    rgba(0,0,0,0.45);

  backdrop-filter:blur(8px);

  animation:fadeIn 0.25s ease;
}

.modal-content{
  width:90%;
  max-width:420px;

  padding:24px;

  border-radius:24px;

  background:
    rgba(255,255,255,0.12);

  backdrop-filter:blur(20px);

  border:
    1px solid rgba(255,255,255,0.1);

  animation:zoomIn 0.25s ease;
}

.modal-content img{
  border-radius:18px;
}

/* =========================
   CHECKBOX GROUP
========================= */

.checkbox-group{
  display:flex;
  flex-direction:column;
  gap:12px;
  margin-top:18px;
}

.checkbox-group label{
  display:flex;
  align-items:center;
  gap:10px;

  padding:14px;

  border-radius:14px;

  background:
    rgba(255,255,255,0.08);
}

/* =========================
   ANIMATIONS
========================= */

@keyframes fadeIn{
  from{
    opacity:0;
  }

  to{
    opacity:1;
  }
}

@keyframes zoomIn{
  from{
    transform:scale(0.85);
    opacity:0;
  }

  to{
    transform:scale(1);
    opacity:1;
  }
}

@keyframes fadeUp{
  from{
    opacity:0;
    transform:translateY(20px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }
}

/* =========================
   MOBILE
========================= */

@media(max-width:900px){

  body{
    flex-direction:column;
  }

  .sidebar{
    width:100%;
    height:auto;
    position:relative;
  }

  .main{
    margin-left:0;
    padding:18px;
  }

  .controls{
    flex-direction:column;
  }

  .stats{
    grid-template-columns:1fr;
  }

  table{
    min-width:700px;
  }
}
/* =========================
   SKELETON LOADING
========================= */

.skeleton-wrapper{
  display:flex;
  flex-direction:column;
  gap:14px;

  margin-bottom:20px;
}

.skeleton-row{
  height:56px;

  border-radius:14px;

  background:
    linear-gradient(
      90deg,
      rgba(255,255,255,0.05),
      rgba(255,255,255,0.12),
      rgba(255,255,255,0.05)
    );

  background-size:200% 100%;

  animation:skeletonMove 1.2s infinite;
}

@keyframes skeletonMove{

  0%{
    background-position:200% 0;
  }

  100%{
    background-position:-200% 0;
  }
}

/* =========================
   IMAGE POPUP PREMIUM
========================= */

#imageModal{
  transition:0.25s ease;
}

#previewImage{
  transition:0.35s ease;
}

#imageModal.show{
  animation:fadeIn 0.25s ease;
}

#imageModal.show .modal-content{
  animation:zoomIn 0.25s ease;
}

/* =========================
   BUTTON LOADING
========================= */

.loading-btn{
  opacity:0.7;
  pointer-events:none;
  position:relative;
}

.loading-btn::after{
  content:"";

  width:16px;
  height:16px;

  border:2px solid rgba(255,255,255,0.3);
  border-top:2px solid white;

  border-radius:50%;

  position:absolute;

  right:16px;
  top:50%;

  transform:translateY(-50%);

  animation:spin 0.7s linear infinite;
}

@keyframes spin{
  to{
    transform:
      translateY(-50%)
      rotate(360deg);
  }
}

</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <h2>TriVi</h2>

  <!-- FILTERS -->
<div class="controls">

  <!-- SEARCH -->
  <div class="control-group">
    <label>Search</label>
    <input type="text" id="searchInput">
  </div>

  <!-- PINPOINT -->
  <div class="control-group">
    <label>📍 Date</label>
    <input type="date" id="singleDate">
  </div>

  <!-- RANGE -->
  <div class="control-group">
    <label>📅 From Date</label>
    <input type="date" id="fromDate">
  </div>

  <div class="control-group">
    <label>📅 To Date</label>
    <input type="date" id="toDate">
  </div>

  <!-- BUTTONS -->
  <button onclick="loadData()">
    Load All
  </button>

  <button onclick="applyFilters()">
    Apply
  </button>

  <button onclick="resetFilters()">
    Reset
  </button>

  <button onclick="exportExcel()">
    Excel Export
  </button>

</div>

  <div class="nav">
    <a href="/dashboard">📊 Dashboard</a>
    <a href="/">📅 Attendance</a>
    <a href="#" onclick="exportExcel()">📤 Export</a>
  </div>

  <div class="logout" onclick="window.location.href='/auth/logout'">
    Logout
  </div>
</div>

<!-- MAIN -->
<div class="main">

  <!-- STATS -->
  <div class="stats">
    <div class="card">Total <div id="total">0</div></div>
    <div class="card">WFH <div id="wfh">0</div></div>
    <div class="card">Office <div id="office">0</div></div>
    <div class="card">Site <div id="site">0</div></div>
    <div class="card">Leave <div id="leave">0</div></div>
    <div class="card">Govt <div id="govt">0</div></div>
  </div>

  <!-- TABLE -->
<div class="table-card">

  <div id="tableLoader" class="skeleton-wrapper">

    <div class="skeleton-row"></div>
    <div class="skeleton-row"></div>
    <div class="skeleton-row"></div>
    <div class="skeleton-row"></div>
    <div class="skeleton-row"></div>

  </div>

  <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Date</th>
          <th>Time</th>
          <th>Work Type</th>
          <th>Image</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

</div>

<!-- IMAGE MODAL -->
<div class="modal" id="imageModal">
  <div class="modal-content">
    <img id="previewImage" style="width:100%; border-radius:10px;">
  </div>
</div>

<!-- EDIT MODAL -->
<div class="modal" id="editModal">

  <div class="modal-content">

    <h3>Edit Work Type</h3>

    <div class="checkbox-group">

      <label>
        <input type="checkbox" value="Work From Home">
        Work From Home
      </label>

      <label>
        <input type="checkbox" value="Office Management">
        Office Management
      </label>

      <label>
        <input type="checkbox" value="Site Visit">
        Site Visit
      </label>

      <label>
        <input type="checkbox" value="Leave">
        Leave
      </label>

      <label>
        <input type="checkbox" value="Government Holiday">
        Government Holiday
      </label>

    </div>

    <div style="margin-top:15px; display:flex; gap:10px;">

      <button
  onclick="resetModal()"
  style="
    background:#2563eb;
    color:white;
    font-weight:600;
  "
>
  Reset
</button>

<button
  onclick="saveEdit()"
  style="
    background:#dc2626;
    color:white;
    font-weight:600;
  "
>
  Save
</button>

    </div>

  </div>

</div>

<script>

let allData = [];
let editId = null;

// LOAD DATA
async function loadData() {

  try {

    const loader =
      document.getElementById("tableLoader");

    if(loader){
      loader.style.display = "flex";
    }

    const res = await fetch("/attendance", {
      credentials: "include"
    });

    const data = await res.json();

    allData = Array.isArray(data) ? data : [];

    render(allData);

    if(loader){
      loader.style.display = "none";
    }

  } catch (err) {
    console.log(err);
    alert("Failed to load attendance");
  }
}

// RENDER TABLE + STATS
function render(data) {

  const tbody = document.getElementById("tbody");

  tbody.innerHTML = "";

  let stats = {
    total: data.length,
    wfh: 0,
    office: 0,
    site: 0,
    leave: 0,
    govt: 0
  };

  data.forEach(item => {

    // STATS
    (item.workTypes || []).forEach(t => {

      if (t.includes("Work From Home")) stats.wfh++;

      else if (t.includes("Office")) stats.office++;

      else if (t.includes("Site")) stats.site++;

      else if (t.includes("Leave")) stats.leave++;

      else if (t.includes("Government")) stats.govt++;
    });

    // TABLE ROW
    const row = document.createElement("tr");

    row.innerHTML = `
      <td>${item.name || ""}</td>

      <td>${item.date || ""}</td>

      <td>${item.day || ""}</td>

      <td>${item.time || ""}</td>

      <td>${(item.workTypes || []).join(", ")}</td>

      <td>
        ${
          item.imageUrl
          ? `
            <img
              src="${item.imageUrl}"
              class="image-preview"
              onclick="openImage('${item.imageUrl}')"
            >
          `
          : "No Image"
        }
      </td>

      <td>
        <button
          class="edit"
          onclick="openEdit('${item._id}')"
        >
          Edit
        </button>

        <button
          class="danger"
          onclick="deleteEntry('${item._id}')"
        >
          Delete
        </button>
      </td>
    `;

    tbody.appendChild(row);
  });

  // UPDATE STATS
  document.getElementById("total").innerText = stats.total;

  document.getElementById("wfh").innerText = stats.wfh;

  document.getElementById("office").innerText = stats.office;

  document.getElementById("site").innerText = stats.site;

  document.getElementById("leave").innerText = stats.leave;

  document.getElementById("govt").innerText = stats.govt;
}

// APPLY FILTERS
function applyFilters() {

  const search =
    document.getElementById("searchInput")
    .value
    .toLowerCase();

  const singleDate =
    document.getElementById("singleDate").value;

  const fromDate =
    document.getElementById("fromDate").value;

  const toDate =
    document.getElementById("toDate").value;

  let filtered = [...allData];

  // SEARCH
  if (search) {

    filtered = filtered.filter(item =>

      (item.name || "")
      .toLowerCase()
      .includes(search)

      ||

      (item.email || "")
      .toLowerCase()
      .includes(search)
    );
  }

  // DATE FILTER
if (fromDate && toDate) {

  // RANGE DATE
  filtered = filtered.filter(item => {

    const itemDate =
      new Date(item.date)
      .toISOString()
      .split("T")[0];

    return (
      itemDate >= fromDate
      &&
      itemDate <= toDate
    );
  });

}

else if (singleDate) {

  // PINPOINT DATE
  filtered = filtered.filter(item => {

    const itemDate =
      new Date(item.date)
      .toISOString()
      .split("T")[0];

    return itemDate === singleDate;
  });
}

  render(filtered);
}

// RESET FILTERS
function resetFilters() {

  document.getElementById("searchInput").value = "";

  document.getElementById("singleDate").value = "";

  document.getElementById("fromDate").value = "";

  document.getElementById("toDate").value = "";

  render(allData);
}

// EXPORT EXCEL
async function exportExcel() {

  const search =
    document.getElementById("searchInput").value;

  const singleDate =
    document.getElementById("singleDate").value;

  const fromDate =
    document.getElementById("fromDate").value;

  const toDate =
    document.getElementById("toDate").value;

  const params = new URLSearchParams();

if (search)
  params.append("search", search);

if (singleDate)
  params.append("singleDate", singleDate);

if (fromDate)
  params.append("fromDate", fromDate);

if (toDate)
  params.append("toDate", toDate);

  try {

    const response = await fetch(

      "/attendance/export/excel?" + params.toString(),

      {
        credentials: "include"
      }
    );

    if (!response.ok) {

      alert("Export failed");

      return;
    }

    const blob = await response.blob();

    const url =
      window.URL.createObjectURL(blob);

    const a = document.createElement("a");

    a.href = url;

    a.download =
      `attendance-${Date.now()}.xlsx`;

    document.body.appendChild(a);

    a.click();

    a.remove();

    window.URL.revokeObjectURL(url);

  } catch (err) {

    console.log(err);

    alert("Export error");
  }
}

// DELETE
async function deleteEntry(id) {

  const confirmDelete =
    confirm("Delete this attendance?");

  if (!confirmDelete) return;

  try {

    await fetch("/attendance/" + id, {

      method: "DELETE",

      credentials: "include"
    });

    loadData();

  } catch (err) {

    console.log(err);

    alert("Delete failed");
  }
}

// OPEN EDIT MODAL
function openEdit(id) {

  editId = id;

  const item =
    allData.find(x => x._id === id);

  const current =
    item?.workTypes || [];

  document
    .querySelectorAll(".checkbox-group input")
    .forEach(cb => {

      cb.checked =
        current.includes(cb.value);
    });

  document
    .getElementById("editModal")
    .style.display = "flex";
}

// SAVE EDIT
async function saveEdit() {

  const selected = Array.from(

    document.querySelectorAll(
      ".checkbox-group input:checked"
    )

  ).map(cb => cb.value);

  if (selected.length === 0) {

    alert("Select at least one option");

    return;
  }

  if (selected.length > 2) {

    alert("Only 2 selections allowed");

    return;
  }

  try {

    await fetch("/attendance/" + editId, {

      method: "PUT",

      headers: {
        "Content-Type": "application/json"
      },

      credentials: "include",

      body: JSON.stringify({
        workTypes: selected
      })
    });

    document
      .getElementById("editModal")
      .style.display = "none";

    loadData();

  } catch (err) {

    console.log(err);

    alert("Update failed");
  }
}

// RESET MODAL
function resetModal() {

  document
    .querySelectorAll(".checkbox-group input")
    .forEach(cb => cb.checked = false);
}

// IMAGE MODAL
function openImage(url) {

  document
    .getElementById("previewImage")
    .src = url;

 const modal =
  document.getElementById("imageModal");

modal.style.display = "flex";

setTimeout(() => {
  modal.classList.add("show");
}, 10);
}

// CLOSE MODALS
document
.getElementById("imageModal")
.addEventListener("click", (e) => {

  if (e.target.id === "imageModal") {

    const modal =
  document.getElementById("imageModal");

modal.classList.remove("show");

setTimeout(() => {
  modal.style.display = "none";
}, 200);
  }
});

document
.getElementById("editModal")
.addEventListener("click", (e) => {

  if (e.target.id === "editModal") {

    document
      .getElementById("editModal")
      .style.display = "none";
  }
});

// GLOBAL BUTTON BINDING
window.applyFilters = applyFilters;

window.resetFilters = resetFilters;

window.exportExcel = exportExcel;

window.deleteEntry = deleteEntry;

window.openEdit = openEdit;

window.saveEdit = saveEdit;

window.resetModal = resetModal;

// INITIAL LOAD
loadData();

</script>


</body>
</html>
