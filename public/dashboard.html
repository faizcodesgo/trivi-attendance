<!DOCTYPE html>
<html>
<head>
  <title>Attendance Dashboard</title>
  <link rel="stylesheet" href="style.css">

  <style>
    body {
      font-family: Arial;
      background: #f4f6f8;
      padding: 30px;
    }

    .container {
      max-width: 1000px;
      margin: auto;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    .btn {
      display: block;
      margin: 0 auto 20px;
      padding: 12px 20px;
      background: black;
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 6px;
      font-size: 14px;
    }

    .card {
      background: white;
      border-radius: 10px;
      box-shadow: 0 0 10px #ccc;
      padding: 20px;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 12px;
      text-align: center;
      border-bottom: 1px solid #eee;
    }

    th {
      background: black;
      color: white;
    }

    tr:hover {
      background: #f9f9f9;
    }

    img {
      border-radius: 6px;
    }
  </style>
</head>

<body>

<div class="container">

  <h2>📊 Attendance Dashboard</h2>

  <button class="btn" onclick="loadData()">Load Attendance</button>

  <div class="card">
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Date</th>
          <th>Day</th>
          <th>Time</th>
          <th>Work Type</th>
          <th>Image</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

</div>

<script>
async function loadData() {
  try {
    const res = await fetch("/attendance", {
      credentials: "include"
    });

    const data = await res.json();

    const tbody = document.getElementById("tbody");
    tbody.innerHTML = "";

    data.forEach(item => {
      const row = document.createElement("tr");

      row.innerHTML = `
        <td>${item.name}</td>
        <td>${item.date}</td>
        <td>${item.day}</td>
        <td>${item.time}</td>
        <td>${item.workTypes.join(", ")}</td>
        <td>
          ${item.imageUrl 
            ? `<img src="${item.imageUrl}" width="70">` 
            : "No image"}
        </td>
      `;

      tbody.appendChild(row);
    });

  } catch (err) {
    alert("Error loading data");
    console.error(err);
  }
}
</script>

</body>
</html>
