<!DOCTYPE html>
<html>
<head>
  <title>Attendance Dashboard</title>
  <link rel="stylesheet" href="style.css">

  <style>
    body {
      font-family: Arial;
      background: #f4f6f8;
      padding: 30px;
    }

    .container {
      max-width: 1100px;
      margin: auto;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
      background: white;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 0 10px #ccc;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      font-size: 12px;
    }

    input, button {
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    button {
      background: black;
      color: white;
      cursor: pointer;
      border: none;
    }

    .danger { background: red; }
    .edit { background: #007bff; }

    .stats {
      display: flex;
      justify-content: space-around;
      background: white;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 0 10px #ccc;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .card {
      background: white;
      border-radius: 10px;
      box-shadow: 0 0 10px #ccc;
      padding: 20px;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 10px;
      text-align: center;
      border-bottom: 1px solid #eee;
    }

    th {
      background: black;
      color: white;
    }

    /* ===== MODAL ===== */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.6);
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: white;
      padding: 20px;
      border-radius: 10px;
      width: 300px;
    }

    .modal-content h3 {
      margin-bottom: 10px;
    }

    .checkbox-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin: 10px 0;
    }

    .modal-buttons {
      display: flex;
      justify-content: space-between;
      margin-top: 10px;
    }

    .reset {
      background: orange;
    }
  </style>
</head>

<body>

<div class="container">

  <h2>📊 Attendance Dashboard</h2>

  <!-- CONTROLS -->
  <div class="controls">
    <div class="control-group">
      <label>Search</label>
      <input type="text" id="searchInput">
    </div>

    <div class="control-group">
      <label>Single Date</label>
      <input type="date" id="singleDate">
    </div>

    <div class="control-group">
      <label>From</label>
      <input type="date" id="fromDate">
    </div>

    <div class="control-group">
      <label>To</label>
      <input type="date" id="toDate">
    </div>

    <button onclick="loadData()">Load</button>
    <button onclick="applyFilters()">Apply</button>
  </div>

  <!-- STATS -->
  <div class="stats">
    <div>Total: <span id="total">0</span></div>
    <div>WFH: <span id="wfh">0</span></div>
    <div>Office: <span id="office">0</span></div>
    <div>Site: <span id="site">0</span></div>
    <div>Leave: <span id="leave">0</span></div>
    <div>Govt: <span id="govt">0</span></div>
  </div>

  <!-- TABLE -->
  <div class="card">
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Date</th>
          <th>Work Type</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<!-- ===== EDIT MODAL ===== -->
<div class="modal" id="editModal">
  <div class="modal-content">
    <h3>Edit Work Type</h3>

    <div class="checkbox-group">
      <label><input type="checkbox" value="Work From Home"> Work From Home</label>
      <label><input type="checkbox" value="Office Management"> Office Management</label>
      <label><input type="checkbox" value="Site Visit"> Site Visit</label>
      <label><input type="checkbox" value="Leave"> Leave</label>
      <label><input type="checkbox" value="Government Holiday"> Government Holiday</label>
    </div>

    <div class="modal-buttons">
      <button class="reset" onclick="resetModal()">Reset</button>
      <button onclick="saveEdit()">Save</button>
    </div>
  </div>
</div>

<script>

let allData = [];
let editId = null;

// LOAD
async function loadData() {
  const res = await fetch("/attendance", { credentials: "include" });
  const data = await res.json();

  allData = Array.isArray(data) ? data : [];
  applyFilters();
}

// FILTER
function applyFilters() {
  const search = document.getElementById("searchInput").value.toLowerCase();
  const singleDate = document.getElementById("singleDate").value;
  const fromDate = document.getElementById("fromDate").value;
  const toDate = document.getElementById("toDate").value;

  let filtered = [...allData];

  if (search) {
    filtered = filtered.filter(i =>
      (i.name || "").toLowerCase().includes(search) ||
      (i.email || "").toLowerCase().includes(search)
    );
  }

  if (fromDate && toDate) {
    filtered = filtered.filter(i => i.date >= fromDate && i.date <= toDate);
  } else if (singleDate) {
    filtered = filtered.filter(i => i.date === singleDate);
  }

  render(filtered);
}

// STATS
function updateStats(data) {
  let c = { total: data.length, wfh:0, office:0, site:0, leave:0, govt:0 };

  data.forEach(i => {
    (i.workTypes || []).forEach(t => {
      t = t.toLowerCase();
      if (t.includes("work from home")) c.wfh++;
      else if (t.includes("office")) c.office++;
      else if (t.includes("site")) c.site++;
      else if (t.includes("leave")) c.leave++;
      else if (t.includes("government")) c.govt++;
    });
  });

  document.getElementById("total").innerText = c.total;
  document.getElementById("wfh").innerText = c.wfh;
  document.getElementById("office").innerText = c.office;
  document.getElementById("site").innerText = c.site;
  document.getElementById("leave").innerText = c.leave;
  document.getElementById("govt").innerText = c.govt;
}

// TABLE
function render(data) {
  updateStats(data);

  const tbody = document.getElementById("tbody");
  tbody.innerHTML = "";

  data.forEach(item => {
    const row = document.createElement("tr");

    row.innerHTML = `
      <td>${item.name || ""}</td>
      <td>${item.date || ""}</td>
      <td>${(item.workTypes || []).join(", ")}</td>
      <td>
        <button class="edit" onclick="openEdit('${item._id}', ${JSON.stringify(item.workTypes || [])})">Edit</button>
        <button class="danger" onclick="deleteEntry('${item._id}')">Delete</button>
      </td>
    `;

    tbody.appendChild(row);
  });
}

// DELETE
async function deleteEntry(id) {
  if (!confirm("Delete?")) return;

  await fetch("/attendance/" + id, {
    method: "DELETE",
    credentials: "include"
  });

  loadData();
}

// ===== MODAL LOGIC =====
function openEdit(id, currentTypes) {
  editId = id;

  document.querySelectorAll(".checkbox-group input").forEach(cb => {
    cb.checked = currentTypes.includes(cb.value);
  });

  document.getElementById("editModal").style.display = "flex";
}

function resetModal() {
  document.querySelectorAll(".checkbox-group input").forEach(cb => cb.checked = false);
}

async function saveEdit() {
  const selected = Array.from(document.querySelectorAll(".checkbox-group input:checked"))
    .map(cb => cb.value);

  await fetch("/attendance/" + editId, {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    credentials: "include",
    body: JSON.stringify({ workTypes: selected })
  });

  document.getElementById("editModal").style.display = "none";
  loadData();
}

</script>

</body>
</html>
