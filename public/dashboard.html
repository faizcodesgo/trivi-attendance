<!DOCTYPE html>
<html>
<head>
  <title>Attendance Dashboard</title>
  <link rel="stylesheet" href="style.css">

  <style>
    body {
      padding: 20px;
    }

    h2 {
      text-align: center;
    }

    button {
      margin: 20px 0;
      padding: 10px;
      cursor: pointer;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      background: white;
    }

    th, td {
      padding: 10px;
      border: 1px solid #ccc;
      text-align: center;
    }

    th {
      background: black;
      color: white;
    }

    img {
      border-radius: 5px;
    }
  </style>
</head>

<body>

<h2>📊 Attendance Dashboard</h2>

<button onclick="loadData()">Load Attendance</button>

<table id="table">
  <thead>
    <tr>
      <th>Name</th>
      <th>Date</th>
      <th>Day</th>
      <th>Time</th>
      <th>Work Type</th>
      <th>Image</th>
    </tr>
  </thead>
  <tbody id="tbody"></tbody>
</table>

<script>
async function loadData() {
  try {
    const res = await fetch("/attendance", {
      method: "GET",
      credentials: "include"
    });

    const data = await res.json();

    const tbody = document.getElementById("tbody");
    tbody.innerHTML = "";

    data.forEach(item => {
      const row = document.createElement("tr");

      row.innerHTML = `
        <td>${item.name}</td>
        <td>${item.date}</td>
        <td>${item.day}</td>
        <td>${item.time}</td>
        <td>${item.workTypes.join(", ")}</td>
        <td>
          ${item.imageUrl 
            ? `<img src="${item.imageUrl}" width="80">` 
            : "No image"}
        </td>
      `;

      tbody.appendChild(row);
    });

  } catch (err) {
    alert("Failed to load data");
    console.error(err);
  }
}
</script>

</body>
</html>
