<!DOCTYPE html>
<html>
<head>
  <title>Dashboard - TriVi Infracons</title>
  <link rel="stylesheet" href="style.css">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      display: flex;
    }

    /* SIDEBAR */
    .sidebar {
      width: 240px;
      background: #0b1f3a;
      color: white;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 20px;
      position: fixed;
    }

    .sidebar h2 {
      margin-bottom: 30px;
    }

    .nav {
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex: 1;
    }

    .nav a {
      color: white;
      text-decoration: none;
      padding: 10px;
      border-radius: 8px;
      transition: 0.2s;
      font-size: 14px;
    }

    .nav a:hover {
      background: rgba(255,255,255,0.1);
    }

    .logout {
      background: #702020;
      text-align: center;
      padding: 10px;
      border-radius: 10px;
      cursor: pointer;
      margin-top: auto;
    }

    /* MAIN */
    .main {
      margin-left: 240px;
      padding: 20px;
      width: 100%;
    }

    /* TOP BAR */
    .topbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 20px;
      align-items: center;
    }

    .topbar input,
    .topbar button {
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ddd;
    }

    .topbar button {
      background: #111827;
      color: white;
      cursor: pointer;
      border: none;
    }

    /* STATS */
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }

    .card {
      background: white;
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.05);
      text-align: center;
      font-weight: bold;
    }

    /* TABLE */
    .table-card {
      background: white;
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.05);
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 12px;
      text-align: center;
      border-bottom: 1px solid #eee;
      font-size: 14px;
    }

    th {
      background: #111827;
      color: white;
    }

    tr:hover {
      background: #f9fafb;
    }

    .edit {
      background: #2563eb;
      color: white;
      border: none;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
    }

    .danger {
      background: #dc2626;
      color: white;
      border: none;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
    }

    .image-preview {
      width: 40px;
      height: 40px;
      object-fit: cover;
      border-radius: 6px;
      cursor: pointer;
    }

    /* MODAL */
    .modal {
      display: none;
      position: fixed;
      top:0;
      left:0;
      width:100%;
      height:100%;
      background: rgba(0,0,0,0.5);
      justify-content:center;
      align-items:center;
    }

    .modal-content {
      background: white;
      padding: 20px;
      border-radius: 12px;
      width: 300px;
    }
  </style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <h2>TriVi</h2>

  <div class="nav">
    <a href="/dashboard">📊 Dashboard</a>
    <a href="/">📅 Attendance</a>
    <a href="#" onclick="exportExcel()">📤 Export</a>
  </div>

  <div class="logout" onclick="window.location.href='/auth/logout'">
    Logout
  </div>
</div>

<!-- MAIN -->
<div class="main">

  <!-- TOP BAR -->
  <div class="topbar">
    <input type="text" id="searchInput" placeholder="Search">
    <input type="date" id="singleDate">
    <input type="date" id="fromDate">
    <input type="date" id="toDate">

    <button onclick="applyFilters()">Apply</button>
    <button onclick="resetFilters()">Reset</button>
  </div>

  <!-- STATS -->
  <div class="stats">
    <div class="card">Total <div id="total">0</div></div>
    <div class="card">WFH <div id="wfh">0</div></div>
    <div class="card">Office <div id="office">0</div></div>
    <div class="card">Site <div id="site">0</div></div>
    <div class="card">Leave <div id="leave">0</div></div>
    <div class="card">Govt <div id="govt">0</div></div>
  </div>

  <!-- TABLE -->
  <div class="table-card">
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Date</th>
          <th>Time</th>
          <th>Work Type</th>
          <th>Image</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

</div>

<!-- IMAGE MODAL -->
<div class="modal" id="imageModal">
  <div class="modal-content">
    <img id="previewImage" style="width:100%; border-radius:10px;">
  </div>
</div>

<script>
let allData = [];

async function loadData() {
  const res = await fetch("/attendance", { credentials: "include" });
  allData = await res.json();
  render(allData);
}

function render(data) {
  document.getElementById("tbody").innerHTML = "";

  let stats = { total: data.length, wfh:0, office:0, site:0, leave:0, govt:0 };

  data.forEach(item => {

    (item.workTypes || []).forEach(t => {
      if (t.includes("Work From Home")) stats.wfh++;
      else if (t.includes("Office")) stats.office++;
      else if (t.includes("Site")) stats.site++;
      else if (t.includes("Leave")) stats.leave++;
      else if (t.includes("Government")) stats.govt++;
    });

    const row = document.createElement("tr");

    row.innerHTML = `
      <td>${item.name || ""}</td>
      <td>${item.date || ""}</td>
      <td>${item.time || ""}</td>
      <td>${(item.workTypes || []).join(", ")}</td>
      <td>
        ${item.imageUrl ? `<img src="${item.imageUrl}" class="image-preview" onclick="openImage('${item.imageUrl}')">` : "No"}
      </td>
      <td>
        <button class="edit" onclick="openEdit('${item._id}')">Edit</button>
        <button class="danger" onclick="deleteEntry('${item._id}')">Del</button>
      </td>
    `;

    document.getElementById("tbody").appendChild(row);
  });

  document.getElementById("total").innerText = stats.total;
  document.getElementById("wfh").innerText = stats.wfh;
  document.getElementById("office").innerText = stats.office;
  document.getElementById("site").innerText = stats.site;
  document.getElementById("leave").innerText = stats.leave;
  document.getElementById("govt").innerText = stats.govt;
}

function openImage(url) {
  document.getElementById("previewImage").src = url;
  document.getElementById("imageModal").style.display = "flex";
}

document.getElementById("imageModal").onclick = () => {
  document.getElementById("imageModal").style.display = "none";
};

loadData();
</script>

</body>
</html>
