<!DOCTYPE html>
<html>
<head>
  <title>Attendance Dashboard</title>
  <link rel="stylesheet" href="style.css">

  <style>
    body {
      font-family: Arial;
      background: #f4f6f8;
      padding: 30px;
    }

    .container {
      max-width: 1100px;
      margin: auto;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
      background: white;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 0 10px #ccc;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      font-size: 12px;
    }

    input, button {
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    button {
      background: black;
      color: white;
      cursor: pointer;
      border: none;
    }

    .danger {
      background: red;
    }

    .edit {
      background: #007bff;
    }

    .stats {
      display: flex;
      justify-content: space-around;
      background: white;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 0 10px #ccc;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .card {
      background: white;
      border-radius: 10px;
      box-shadow: 0 0 10px #ccc;
      padding: 20px;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 10px;
      text-align: center;
      border-bottom: 1px solid #eee;
    }

    th {
      background: black;
      color: white;
    }
  </style>
</head>

<body>

<div class="container">

  <h2>📊 Attendance Dashboard</h2>

  <!-- CONTROLS -->
  <div class="controls">

    <div class="control-group">
      <label>Search (Name / Email)</label>
      <input type="text" id="searchInput">
    </div>

    <div class="control-group">
      <label>Single Date</label>
      <input type="date" id="singleDate">
    </div>

    <div class="control-group">
      <label>Range From</label>
      <input type="date" id="fromDate">
    </div>

    <div class="control-group">
      <label>Range To</label>
      <input type="date" id="toDate">
    </div>

    <button onclick="loadData()">Load</button>
    <button onclick="applyFilters()">Apply</button>

  </div>

  <!-- STATS -->
  <div class="stats">
    <div>Total: <span id="total">0</span></div>
    <div>WFH: <span id="wfh">0</span></div>
    <div>Office: <span id="office">0</span></div>
    <div>Site: <span id="site">0</span></div>
    <div>Leave: <span id="leave">0</span></div>
    <div>Govt: <span id="govt">0</span></div>
  </div>

  <!-- TABLE -->
  <div class="card">
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Date</th>
          <th>Work Type</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

</div>

<script>

let allData = [];

// LOAD
async function loadData() {
  const res = await fetch("/attendance", { credentials: "include" });
  allData = await res.json();
  applyFilters();
}

// FILTER
function applyFilters() {
  const search = document.getElementById("searchInput").value.toLowerCase();
  const singleDate = document.getElementById("singleDate").value;
  const fromDate = document.getElementById("fromDate").value;
  const toDate = document.getElementById("toDate").value;

  let filtered = [...allData];

  if (search) {
    filtered = filtered.filter(item =>
      item.name.toLowerCase().includes(search) ||
      item.email.toLowerCase().includes(search)
    );
  }

  if (fromDate && toDate) {
    filtered = filtered.filter(i => i.date >= fromDate && i.date <= toDate);
  } else if (singleDate) {
    filtered = filtered.filter(i => i.date === singleDate);
  }

  render(filtered);
}

// TABLE
function render(data) {
  const tbody = document.getElementById("tbody");
  tbody.innerHTML = "";

  data.forEach(item => {
    const row = document.createElement("tr");

    row.innerHTML = `
      <td>${item.name}</td>
      <td>${item.date}</td>
      <td>${item.workTypes.join(", ")}</td>
      <td>
        <button class="edit" onclick="editEntry('${item._id}')">Edit</button>
        <button class="danger" onclick="deleteEntry('${item._id}')">Delete</button>
      </td>
    `;

    tbody.appendChild(row);
  });
}

// DELETE
async function deleteEntry(id) {
  if (!confirm("Delete this entry?")) return;

  await fetch("/attendance/" + id, {
    method: "DELETE",
    credentials: "include"
  });

  loadData();
}

// EDIT
async function editEntry(id) {
  const newType = prompt("Enter new work type (exact name)");

  if (!newType) return;

  await fetch("/attendance/" + id, {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    credentials: "include",
    body: JSON.stringify({ workTypes: [newType] })
  });

  loadData();
}

</script>

</body>
</html>
