<!DOCTYPE html>
<html>
<head>
  <title>Attendance Dashboard</title>
  <link rel="stylesheet" href="style.css">

  <style>
    body {
      font-family: Arial;
      background: #f4f6f8;
      padding: 30px;
    }

    .container {
      max-width: 1000px;
      margin: auto;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    input, button {
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    button {
      background: black;
      color: white;
      cursor: pointer;
      border: none;
    }

    .stats {
      display: flex;
      justify-content: space-around;
      background: white;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 0 10px #ccc;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .stats div {
      text-align: center;
      font-weight: bold;
    }

    .card {
      background: white;
      border-radius: 10px;
      box-shadow: 0 0 10px #ccc;
      padding: 20px;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 12px;
      text-align: center;
      border-bottom: 1px solid #eee;
    }

    th {
      background: black;
      color: white;
    }

    tr:hover {
      background: #f9f9f9;
    }

    img {
      border-radius: 6px;
    }
  </style>
</head>

<body>

<div class="container">

  <h2>📊 Attendance Dashboard</h2>

  <div class="controls">
    <input type="date" id="dateFilter">
    <button onclick="loadData()">Load All</button>
    <button onclick="filterByDate()">Filter</button>
  </div>

  <!-- 🔥 STATS -->
  <div class="stats">
    <div>Total: <span id="total">0</span></div>
    <div>WFH: <span id="wfh">0</span></div>
    <div>Office: <span id="office">0</span></div>
    <div>Site: <span id="site">0</span></div>
    <div>Leave: <span id="leave">0</span></div>
  </div>

  <div class="card">
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Date</th>
          <th>Day</th>
          <th>Time</th>
          <th>Work Type</th>
          <th>Image</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

</div>

<script>

let allData = [];

// 🔥 COUNT CALCULATOR
function updateCounts(data) {
  let total = data.length;
  let wfh = 0, office = 0, site = 0, leave = 0;

  data.forEach(item => {
    if (item.workTypes.includes("Work From Home")) wfh++;
    if (item.workTypes.includes("Office Management")) office++;
    if (item.workTypes.includes("Site Visit")) site++;
    if (item.workTypes.includes("Leave")) leave++;
  });

  document.getElementById("total").innerText = total;
  document.getElementById("wfh").innerText = wfh;
  document.getElementById("office").innerText = office;
  document.getElementById("site").innerText = site;
  document.getElementById("leave").innerText = leave;
}

// 🔥 LOAD DATA
async function loadData() {
  try {
    const res = await fetch("/attendance", {
      credentials: "include"
    });

    const data = await res.json();
    allData = data;

    renderTable(data);
    updateCounts(data);

  } catch (err) {
    alert("Error loading data");
  }
}

// 🔥 FILTER
function filterByDate() {
  const selectedDate = document.getElementById("dateFilter").value;

  if (!selectedDate) {
    alert("Select a date first");
    return;
  }

  const filtered = allData.filter(item => item.date === selectedDate);

  renderTable(filtered);
  updateCounts(filtered);
}

// 🔥 TABLE
function renderTable(data) {
  const tbody = document.getElementById("tbody");
  tbody.innerHTML = "";

  data.forEach(item => {
    const row = document.createElement("tr");

    row.innerHTML = `
      <td>${item.name}</td>
      <td>${item.date}</td>
      <td>${item.day}</td>
      <td>${item.time}</td>
      <td>${item.workTypes.join(", ")}</td>
      <td>
        ${item.imageUrl 
          ? `<img src="${item.imageUrl}" width="70">` 
          : "No image"}
      </td>
    `;

    tbody.appendChild(row);
  });
}

</script>

</body>
</html>
