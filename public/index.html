<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>TriVi Infracons</title>

  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#7f1d1d">
</head>

<body>

<div class="split-container">

  <!-- =========================
       LEFT SIDE
  ========================== -->

  <div class="left-panel">

    <div class="left-content">

      <img
        src="logo.jpeg"
        class="hero-logo"
      >

      <h1>Welcome</h1>

      <p class="hero-text">
        Smart Employee Attendance
        System for TriVi Infracons
        <br font-size="10px">
        ----Dessigned by Faiz Ahmed 
      </p>

      <img
  src="https://cdn-icons-png.flaticon.com/512/3652/3652191.png"
  class="hero-image calendar-image"
>

    </div>

  </div>

  <!-- =========================
       RIGHT SIDE
  ========================== -->

  <div class="right-panel">

    <div class="form-box">

      <!-- HEADER -->
      <div class="header">

        <img
          src="logo.jpeg"
          class="logo"
        >

        <h2>Employee Attendance</h2>

        <p>
          Please mark your attendance
        </p>

      </div>

      <!-- CHECKBOXES -->
      <div class="checkboxes">

        <label class="checkbox-item">

          <input
            type="checkbox"
            name="workTypes"
            value="Work From Home"
          >

          <span>Work From Home</span>

        </label>

        <label class="checkbox-item">

          <input
            type="checkbox"
            name="workTypes"
            value="Office Management"
          >

          <span>Office Management</span>

        </label>

        <label class="checkbox-item">

          <input
            type="checkbox"
            name="workTypes"
            value="Site Visit"
          >

          <span>Site Visit</span>

        </label>

        <label class="checkbox-item">

          <input
            type="checkbox"
            name="workTypes"
            value="Leave"
          >

          <span>Leave</span>

        </label>

        <label class="checkbox-item">

          <input
            type="checkbox"
            name="workTypes"
            value="Government Holiday"
          >

          <span>Government Holiday</span>

        </label>

      </div>

      <!-- IMAGE -->
      <label
        for="image"
        class="upload-btn"
      >
        Upload Image
      </label>

      <input
        type="file"
        id="image"
        accept="image/*"
        hidden
      >

      <!-- IMAGE NAME -->
      <div
        id="imageName"
        class="image-name"
      >
        No image selected
      </div>

      <!-- LOADING -->
      <div
        id="loadingBox"
        class="loading-box"
        style="display:none;"
      >
        Uploading image...
      </div>

      <!-- BUTTONS -->
      <button
        id="submitBtn"
        onclick="submitAttendance()"
        class="submit-btn"
      >
        Submit Attendance
      </button>

      <button
        onclick="resetForm()"
        class="reset-btn"
      >
        Reset
      </button>

      <!-- ADMIN ONLY -->
      <button
        id="dashboardBtn"
        onclick="goDashboard()"
        class="dashboard-btn"
        style="display:none;"
      >
        Open Dashboard
      </button>

      <!-- LOGOUT -->
      <a
        href="/auth/logout"
        style="width:100%;"
      >

        <button class="logout-btn">
          Logout
        </button>

      </a>

      <!-- MESSAGE -->
      <p id="msg"></p>

    </div>

  </div>

</div>

<script src="app.js"></script>

</body>
</html>
