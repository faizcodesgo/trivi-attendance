<!DOCTYPE html>
<html>
<head>
  <title>TriVi Infracons Attendance</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <div class="header">
      <img src="logo.jpeg" class="logo">
      <h2>TriVi Infracons</h2>
      <p>Employee Attendance System</p>

      <!-- 🔥 LOGIN BUTTON -->
      <a href="/auth/google">
        <button>Login with Google</button>
      </a>

      <!-- 🔥 LOGOUT BUTTON -->
      <a href="/auth/logout">
        <button>Logout</button>
      </a>

    </div>

    <div class="card">

      <div class="checkboxes">
        <label><input type="checkbox" value="Work From Home"> Work From Home</label>
        <label><input type="checkbox" value="Office Management"> Office</label>
        <label><input type="checkbox" value="Site Visit"> Site Visit</label>
        <label><input type="checkbox" value="Leave"> Leave</label>
        <label><input type="checkbox" value="Government Holiday"> Govt Holiday</label>
      </div>

      <input type="file" id="image" style="display:none;">

      <button onclick="submitAttendance()">Submit Attendance</button>

      <p id="msg"></p>

    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
