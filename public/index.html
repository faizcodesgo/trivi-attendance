<!DOCTYPE html>
<html>
<head>
  <title>Attendance</title>
  <link rel="stylesheet" href="style.css">

  <style>
    body {
      margin: 0;
      display: flex;
      height: 100vh;
      font-family: Arial;
    }

    .left {
      flex: 1;
      background: linear-gradient(135deg,#0b3a6a,#06213d);
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .left img {
      width: 140px;
      border-radius: 50%;
      margin-bottom: 20px;
    }

    .right {
      flex: 1.2;
      padding: 40px;
      background: #f5f6f8;
    }

    .box {
      background: white;
      padding: 25px;
      border-radius: 15px;
    }

    .checkbox-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
      margin-bottom: 10px;
    }

    button {
      width: 100%;
      margin-top: 10px;
      padding: 12px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
    }

    .submit { background: #702020; color: white; }
    .reset { background: orange; }
    .dash { background: #111; color: white; }
  </style>
</head>

<body>

<!-- LEFT -->
<div class="left">
  <img src="logo.jpeg">
  <h2>TriVi Infracons</h2>
  <p>Attendance System</p>
</div>

<!-- RIGHT -->
<div class="right">

  <div class="box">

    <!-- CHECKBOXES -->
    <label class="checkbox-item">
      <input type="checkbox" name="workTypes" value="Work From Home">
      Work From Home
    </label>

    <label class="checkbox-item">
      <input type="checkbox" name="workTypes" value="Office Management">
      Office
    </label>

    <label class="checkbox-item">
      <input type="checkbox" name="workTypes" value="Site Visit">
      Site Visit
    </label>

    <label class="checkbox-item">
      <input type="checkbox" name="workTypes" value="Leave">
      Leave
    </label>

    <label class="checkbox-item">
      <input type="checkbox" name="workTypes" value="Government Holiday">
      Govt Holiday
    </label>

    <!-- BUTTONS -->
    <button class="submit" onclick="submitAttendance()">Submit</button>
    <button class="reset" onclick="resetForm()">Reset</button>

    <!-- ADMIN ONLY -->
    <button id="dashboardBtn" class="dash" style="display:none" onclick="goDashboard()">
      Dashboard
    </button>

    <button onclick="window.location.href='/auth/logout'">
      Logout
    </button>

    <p id="msg"></p>

  </div>

</div>

<script src="app.js"></script>

<script>

async function checkAdmin() {
  const res = await fetch("/api/check-admin", { credentials: "include" });
  const data = await res.json();

  if (data.isAdmin) {
    document.getElementById("dashboardBtn").style.display = "block";
  }
}

function goDashboard() {
  window.location.href = "/dashboard";
}

function resetForm() {
  document.querySelectorAll("input[type=checkbox]").forEach(c => c.checked = false);
}

checkAdmin();

</script>

</body>
</html>
