<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TriVi Infracons — Attendance</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="/trivi-favicon-96.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0b2433">
</head>

<body>

<div class="split-container">

  <!-- LEFT SIDE -->
  <div class="left-panel">
    <div class="left-content">

      <img src="trivi-logo.png" alt="TriVi Infracons" class="hero-logo">

      <h1>Welcome</h1>

      <p class="hero-text">
        Employee attendance system for TriVi Infracons Pvt Ltd
        <span class="by">Lake rejuvenation &amp; watershed engineering</span>
      </p>

      <!-- real lake-rejuvenation photo from triviinfra.com -->
      <img class="hero-art" src="trivi-lake.jpg" alt="A TriVi-rejuvenated lake set in green hills">
      <span class="hero-caption">A lake rejuvenated by TriVi</span>

    </div>
  </div>

  <!-- RIGHT SIDE -->
  <div class="right-panel">
    <div class="form-box">

      <!-- HEADER -->
      <div class="header">
        <img src="trivi-logo.png" alt="TriVi Infracons" class="logo">
        <h2>Mark your attendance</h2>
        <p>Select your work type for today</p>
      </div>

      <!-- CHECKBOXES -->
      <div class="checkboxes">
        <label class="checkbox-item">
          <input type="checkbox" name="workTypes" value="Work From Home">
          <span>Work From Home</span>
        </label>
        <label class="checkbox-item">
          <input type="checkbox" name="workTypes" value="Office Management">
          <span>Office Management</span>
        </label>
        <label class="checkbox-item">
          <input type="checkbox" name="workTypes" value="Site Visit">
          <span>Site Visit</span>
        </label>
        <label class="checkbox-item">
          <input type="checkbox" name="workTypes" value="Leave">
          <span>Leave</span>
        </label>
        <label class="checkbox-item">
          <input type="checkbox" name="workTypes" value="Government Holiday">
          <span>Government Holiday</span>
        </label>
      </div>

      <!-- IMAGE -->
      <label for="image" class="upload-btn">Upload Image</label>
      <input type="file" id="image" accept="image/*" hidden>

      <div id="imageName" class="image-name">No image selected</div>

      <div id="loadingBox" class="loading-box" style="display:none;">
        <div class="lb-row">
          <span class="spinner"></span>
          <span>Uploading image…</span>
        </div>
        <div class="progress"><span></span></div>
      </div>

      <!-- BUTTONS -->
      <button id="submitBtn" onclick="submitAttendance()" class="submit-btn">
        Submit Attendance
      </button>

      <button onclick="resetForm()" class="reset-btn">Reset</button>

      <button id="dashboardBtn" onclick="goDashboard()" class="dashboard-btn" style="display:none;">
        Open Dashboard
      </button>

      <button id="enableReminders" onclick="enableReminders()" class="reminder-btn">
        Enable reminders
      </button>

      <a href="/auth/logout" style="text-decoration:none;">
        <button class="logout-btn">Logout</button>
      </a>

      <p id="msg"></p>

    </div>
  </div>

</div>

<script src="app.js"></script>

</body>
</html>
