<!DOCTYPE html>
<html>
<head>
  <title>TriVi Infracons</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

  <div class="card">

    <div class="login-layout">

      <!-- LEFT PANEL -->
      <div class="left-panel">
        <h1>TriVi Infracons</h1>

        <p>
          Professional employee attendance management system
          with cloud image uploads and smart dashboard analytics.
        </p>
      </div>

      <!-- RIGHT PANEL -->
      <div class="right-panel">

        <div class="header">

          <img src="logo.jpeg" class="logo">

          <h2>Employee Attendance</h2>

          <p>Please mark your attendance</p>

          <button
            id="dashboardBtn"
            style="display:none;"
            onclick="goDashboard()"
          >
            Open Dashboard
          </button>

        </div>

        <!-- CHECKBOXES -->
        <div class="checkboxes">

          <label>
            <input type="checkbox" name="workTypes" value="Work From Home">
            Work From Home
          </label>

          <label>
            <input type="checkbox" name="workTypes" value="Office Management">
            Office
          </label>

          <label>
            <input type="checkbox" name="workTypes" value="Site Visit">
            Site Visit
          </label>

          <label>
            <input type="checkbox" name="workTypes" value="Leave">
            Leave
          </label>

          <label>
            <input type="checkbox" name="workTypes" value="Government Holiday">
            Government Holiday
          </label>

        </div>

        <!-- IMAGE -->
        <label for="image" class="upload-btn">
          Upload Image
        </label>

        <input
          type="file"
          id="image"
          accept="image/*"
          hidden
        >

        <!-- IMAGE NAME -->
        <div id="imageName" class="image-name">
          No image selected
        </div>

        <!-- LOADING -->
        <div id="loadingBox" class="loading-box" style="display:none;">
          Uploading image...
        </div>

        <!-- BUTTONS -->
        <button id="submitBtn" onclick="submitAttendance()">
          Submit Attendance
        </button>

        <button
          onclick="resetForm()"
          class="reset-btn"
        >
          Reset
        </button>

        <a href="/auth/logout" style="width:100%;">
          <button>
            Logout
          </button>
        </a>

        <p id="msg"></p>

      </div>
    </div>
  </div>
</div>

<script src="app.js"></script>

<script>

const imageInput = document.getElementById("image");
const imageName = document.getElementById("imageName");

imageInput.addEventListener("change", () => {

  if (imageInput.files.length > 0) {
    imageName.innerText = imageInput.files[0].name;
  } else {
    imageName.innerText = "No image selected";
  }

});

// RESET
function resetForm() {

  document.querySelectorAll('input[type="checkbox"]').forEach(cb => {
    cb.checked = false;
  });

  imageInput.value = "";

  imageName.innerText = "No image selected";

  document.getElementById("msg").innerText = "";

}

// ADMIN CHECK
async function checkAdmin() {

  try {

    const res = await fetch("/api/check-admin", {
      credentials: "include"
    });

    const data = await res.json();

    if (data.isAdmin) {
      document.getElementById("dashboardBtn").style.display = "block";
    }

  } catch (e) {}

}

function goDashboard() {
  window.location.href = "/dashboard";
}

checkAdmin();

</script>

</body>
</html>
