<!DOCTYPE html>
<html>
<head>
  <title>TriVi Infracons Attendance</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <!-- LEFT -->
  <div class="left-panel">

    <div class="company-box">
      <h1>TriVi Infracons</h1>
      <h3>Pvt Ltd</h3>
    </div>

    <div class="welcome-box">
      <h2>Welcome Back!</h2>
      <p>
        Employee Attendance System <br>
        Mark attendance easily and professionally.
      </p>
    </div>

  </div>

  <!-- RIGHT -->
  <div class="right-panel">

    <div class="top-bar">
      <button id="dashboardBtn" style="display:none;" onclick="goDashboard()">
        Dashboard
      </button>
    </div>

    <div class="form-title">
      Select Work Type
    </div>

    <div class="card">

      <div class="checkboxes">

        <label>
          <input type="checkbox" name="workTypes" value="Work From Home">
          Work From Home
        </label>

        <label>
          <input type="checkbox" name="workTypes" value="Office Management">
          Office
        </label>

        <label>
          <input type="checkbox" name="workTypes" value="Site Visit">
          Site Visit
        </label>

        <label>
          <input type="checkbox" name="workTypes" value="Leave">
          Leave
        </label>

        <label>
          <input type="checkbox" name="workTypes" value="Government Holiday">
          Govt Holiday
        </label>

      </div>

      <label for="image" class="upload-btn">
        Upload Image
      </label>

      <input type="file" id="image" accept="image/*" hidden>

      <button class="submit-btn" onclick="submitAttendance()">
        Submit Attendance
      </button>

      <button class="reset-btn" onclick="resetForm()">
        Reset
      </button>

      <a href="/auth/logout">
        <button class="logout-btn">
          Logout
        </button>
      </a>

      <p id="msg"></p>

    </div>

  </div>

</div>

<script src="app.js"></script>

<script>
async function checkAdmin() {
  try {

    const res = await fetch("/api/check-admin", {
      credentials: "include"
    });

    const data = await res.json();

    if (data.isAdmin) {
      document.getElementById("dashboardBtn").style.display = "block";
    }

  } catch (e) {}
}

function goDashboard() {
  window.location.href = "/dashboard";
}

checkAdmin();
</script>

</body>

</html>
