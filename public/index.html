<!DOCTYPE html>
<html>
<head>
  <title>TriVi Infracons Attendance</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <div class="header">
      <img src="logo.jpeg" class="logo">
      <h2>TriVi Infracons</h2>
      <p>Employee Attendance System</p>

      <!-- Admin only -->
      <button id="dashboardBtn" style="display:none;" onclick="goDashboard()">
        Dashboard
      </button>
    </div>

    <div class="card">

      <div class="checkboxes">
        <label><input type="checkbox" name="workTypes" value="Work From Home"> Work From Home</label>
        <label><input type="checkbox" name="workTypes" value="Office Management"> Office</label>
        <label><input type="checkbox" name="workTypes" value="Site Visit"> Site Visit</label>
        <label><input type="checkbox" name="workTypes" value="Leave"> Leave</label>
        <label><input type="checkbox" name="workTypes" value="Government Holiday"> Govt Holiday</label>
      </div>

      <label for="image" class="upload-btn">
        Upload Image
        </label>
      <input type="file" id="image" accept="image/*" hidden>

      <button onclick="submitAttendance()">Submit Attendance</button>

      <button onclick="resetForm()" style="background:orange;">
        Reset
      </button>

      <a href="/auth/logout">
        <button>Logout</button>
      </a>

      <p id="msg"></p>

    </div>

  </div>

  <script src="app.js"></script>

  <script>
    async function checkAdmin() {
      try {
        const res = await fetch("/api/check-admin", {
          credentials: "include"
        });

        const data = await res.json();

        if (data.isAdmin) {
          document.getElementById("dashboardBtn").style.display = "inline-block";
        }
      } catch (e) {}
    }

    function goDashboard() {
      window.location.href = "/dashboard";
    }

    checkAdmin();
  </script>

</body>
</html>
