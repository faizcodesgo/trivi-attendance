<!DOCTYPE html>
<html>
<head>
  <title>Login - TriVi Infracons</title>
  <link rel="stylesheet" href="style.css">

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0a0a0a;
      font-family: Arial;
    }

    .card {
      width: 350px;
      padding: 30px;
      border-radius: 18px;
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(15px);
      text-align: center;
      color: white;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .logo {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      margin-bottom: 15px;
    }

    a button {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      background: white;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="card">

    <img src="logo.jpeg" class="logo">
    <h2>TriVi Infracons</h2>
    <p>Login to continue</p>

    <!-- ONLY REAL LOGIN -->
    <a href="/auth/google">
      <button>Continue with Google</button>
    </a>

  </div>

</body>
</html>
