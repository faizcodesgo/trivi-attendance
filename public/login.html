<!DOCTYPE html>
<html>
<head>
  <title>Login - TriVi Infracons</title>
  <link rel="stylesheet" href="style.css">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at top, #1b1b1b, #0a0a0a);
      overflow: hidden;
    }

    .login-card {
      width: 100%;
      max-width: 380px;
      padding: 35px;
      border-radius: 20px;

      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);

      text-align: center;

      animation: fadeIn 0.8s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .logo {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 15px;
      border: 3px solid rgba(255,255,255,0.2);
    }

    h2 {
      color: white;
      margin-bottom: 5px;
    }

    p {
      color: #cfcfcf;
      font-size: 14px;
      margin-bottom: 25px;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      font-weight: 600;
      transition: 0.25s;
      margin-top: 12px;
    }

    .google-btn {
      background: white;
      color: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .google-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }

    .google-icon {
      width: 18px;
      height: 18px;
    }

    .primary-btn {
      background: #702020;
      color: white;
    }

    .primary-btn:hover {
      transform: translateY(-2px);
      background: #8a2a2a;
      box-shadow: 0 10px 25px rgba(112,32,32,0.4);
    }
  </style>
</head>

<body>

  <div class="login-card">

    <img src="logo.jpeg" class="logo">

    <h2>TriVi Infracons</h2>
    <p>Secure Employee Attendance System</p>

    <!-- Google Login -->
    <a href="/auth/google" style="text-decoration:none;">
      <button class="btn google-btn">
        <img class="google-icon" src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg">
        Continue with Google
      </button>
    </a>

    <!-- Optional future button -->
    <button class="btn primary-btn">
      Login Portal
    </button>

  </div>

</body>
</html>
