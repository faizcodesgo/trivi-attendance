<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — TriVi Infracons</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="/trivi-favicon-96.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0b2433">
</head>

<body class="login-page">

  <div class="login-container">

    <!-- LEFT SIDE -->
    <div class="login-left">
      <div class="login-left-content">

        <img src="trivi-logo.png" alt="TriVi Infracons" class="login-hero-logo">

        <h1>Welcome back</h1>

        <p>
          Employee attendance management system
          <span class="by">Lake rejuvenation &amp; watershed engineering</span>
        </p>

        <img class="login-hero-art" src="trivi-lake.jpg" alt="A lake rejuvenated by TriVi">
        <span class="login-hero-caption">A lake rejuvenated by TriVi</span>

        <div class="glass-circle one"></div>
        <div class="glass-circle two"></div>

      </div>
    </div>

    <!-- RIGHT SIDE -->
    <div class="login-right">
      <div class="login-card">

        <img src="trivi-logo.png" alt="TriVi Infracons" class="login-logo">

        <h2>TriVi Infracons</h2>

        <p class="login-subtitle">Login to continue</p>

        <a href="/auth/google" style="text-decoration:none;">
          <button class="google-btn">
            <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
              <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
              <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
              <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
            </svg>
            Continue with Google
          </button>
        </a>

      </div>
    </div>

  </div>

</body>
</html>
