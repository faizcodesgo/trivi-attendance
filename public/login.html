<!DOCTYPE html>
<html>
<head>
  <title>Login - TriVi Infracons</title>
  <link rel="stylesheet" href="style.css">

</head>

<body class="login-page">

  <div class="login-bg"></div>

  <div class="login-container">

    <!-- LEFT SIDE -->
    <div class="login-left">

      <div class="login-left-content">

        <img
          src="logo.jpeg"
          class="login-hero-logo"
        >

        <h1>
          Welcome Back
        </h1>

        <p>
          Smart Employee Attendance
          Management System
        </p>

        <div class="glass-circle one"></div>
        <div class="glass-circle two"></div>

      </div>

    </div>

    <!-- RIGHT SIDE -->
    <div class="login-right">

      <div class="login-card">

        <img
          src="logo.jpeg"
          class="login-logo"
        >

        <h2>TriVi Infracons</h2>

        <p class="login-subtitle">
          Login to continue
        </p>

        <!-- KEEP SAME LOGIN -->
        <a href="/auth/google">

          <button class="google-btn">
            Continue with Google
          </button>

        </a>

      </div>

    </div>

  </div>

</body>
</html>
